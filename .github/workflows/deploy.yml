name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Dois deploys simultâneos poderiam publicar versões fora de ordem.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # O gate roda de novo aqui, e não só no CI: este workflow pode ser
      # disparado à mão (workflow_dispatch), e nada deve chegar em produção
      # sem ter passado por lint, tipo e teste.
      - name: Gate
        run: pnpm run gate

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
